name: Deploy

# Publica o site no GitHub Pages com o código da `main` e os dados da branch
# `data`. Roda em push na `main` (release), na mão, e chamado pela coleta diária.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: |
          test -f data/site.json || { echo "::error::data/site.json não existe — rode a coleta"; exit 1; }
          npm run build -w site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
